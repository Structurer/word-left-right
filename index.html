<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>单词卡片</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <!-- 左侧列：上下分栏（输入区域 + 卡片列表） -->
    <div class="column column-left">
      <!-- 上部：固定高度输入区域 -->
      <div class="input-area">
        <input type="text" class="word-input" id="word-input" placeholder="输入单词，按空格判断，按Enter跳过" autofocus>
      </div>
      <!-- 下部：卡片列表 -->
      <div class="container" id="container">
        <div class="loading-tip" id="initial-loading">加载中...</div>
      </div>
    </div>
    <!-- 右侧列 -->
    <div class="column column-right">
      <div class="wordbook-wrap">
        <div class="container" id="wordbook">
          <div class="loading-tip" id="wordbook-empty">右滑卡片添加到生词本</div>
        </div>
      </div>
      <div class="input-panel">
        <div class="input-box" id="input-box" contenteditable="true" data-placeholder="输入文本，右键卡片可同时选中此处内容"></div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
